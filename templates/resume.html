<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Resume</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #0f172a;
            color: #fff;
        }

        .top-bar h2 {
            margin: 0;
            font-size: 18px;
        }

        .btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #0ea5e9;
            color: #fff;
        }

        .pdf-container {
            height: calc(100vh - 56px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h2>My Resume</h2>
        <button class="btn" onclick="downloadPDF()">Download PDF</button>
    </div>

    <div class="pdf-container">
        <iframe src="static/resume.pdf"></iframe>
    </div>

    <script>
        function downloadPDF() {
            if (confirm("Do you want to download this PDF?")) {
                const link = document.createElement("a");
                link.href = "static/resume.pdf";
                link.download = "Yashwant_Kumar_Sahu_Resume.pdf";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>

</body>
</html>
