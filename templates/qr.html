<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scan to Visit Dev Sky Solar</title>

  <!-- Fonts & Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

  <style>
    body{
      font-family:'Inter',sans-serif;
      background-color:#f9fafb;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }

    @page{
      size:A4;
      margin:0;
    }

    .a4-page{
      width:210mm;
      height:297mm;
      padding:25mm;
      background:#fff;
      margin:auto;
      box-sizing:border-box;
    }

    @media print{
      .a4-page{
        box-shadow:none!important;
        border:none!important;
      }
    }
  </style>
</head>

<body class="flex justify-center p-4 bg-gray-100">

<div class="a4-page shadow-lg border rounded-xl flex flex-col items-center justify-center text-center">

  <!-- Header -->
  <h1 class="text-4xl font-bold text-gray-800 mb-2">
    📱 Scan to Connect with Dev Sky Solar
  </h1>
  <p class="text-gray-600 text-sm mb-10">
    Scan the QR code below to submit your enquiry instantly
  </p>

  <!-- SINGLE QR -->
  <div>
    <div id="qr"></div>
    <p class="mt-4 font-semibold text-gray-700">
      www.devskysolar.in/leads
    </p>
  </div>

  <!-- Footer -->
  <div class="mt-16 text-gray-500 text-sm">
    Printed by Yash Cyber Café • Need help? Visit us or call ☎
  </div>

</div>

<script>
  const qr = new QRCodeStyling({
    width: 260,
    height: 260,
    type: "svg",
    data: "https://www.devskysolar.in/leads",
    dotsOptions: {
      color: "#000000",
      type: "rounded"
    },
    backgroundOptions: {
      color: "#ffffff"
    },
    qrOptions: {
      errorCorrectionLevel: "H"
    }
  });

  qr.append(document.getElementById("qr"));
</script>

</body>
</html>
