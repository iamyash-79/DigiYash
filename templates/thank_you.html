<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | DigiYash Digital</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta http-equiv="refresh" content="10;url=/">

    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --accent: #6366f1;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, .08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #030712;
            background: var(--bg); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- UPDATED WRAPPER ---------- */
        .thank-you-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            /* Changed from center to flex-start to allow manual top spacing */
            align-items: flex-start; 
            /* Push content down further from the header */
            padding: 160px 2rem 80px; 
            background: radial-gradient(circle at top, #1e1b4b 0%, #030712 100%);
            position: relative;
        }

        .success-card {
            text-align: center;
            max-width: 650px;
            width: 100%;
            animation: slideUp 1s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative;
            z-index: 10;
        }

        /* Icon Box */
        .icon-box {
            width: 110px;
            height: 110px;
            background: rgba(99, 102, 241, 0.15);
            border: 2px solid #6366f1;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 3rem;
        }

        .icon-box i {
            font-size: 3.5rem;
            color: #6366f1;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.6));
        }

        /* Typography */
        .success-card h1 {
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 2rem;
            line-height: 1;
            color: #ffffff;
        }

        .success-card p {
            color: #94a3b8;
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 4rem;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Redirect UI */
        .redirect-notice {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 1.2rem 3rem;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            color: #f8fafc;
            font-size: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        #countdown {
            color: #6366f1;
            font-weight: 800;
        }

        .home-link {
            display: block;
            margin-top: 3rem;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .home-link:hover { color: #6366f1; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(60px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid #6366f1;
            border-radius: 35px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @media (max-width: 768px) {
            .thank-you-wrapper { padding-top: 120px; }
            .success-card h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    {% include 'header.html' %}

    <main class="thank-you-wrapper">
        <div class="success-card">
            <div class="icon-box">
                <i class="fas fa-check"></i>
            </div>
            
            <h1>Success.</h1>
            
            <p>Your message has been transmitted. Our lead engineer will review your project details and reach out within 24 hours.</p>
            
            <div class="redirect-notice">
                <i class="fas fa-circle-notch fa-spin"></i>
                <span>Returning to home in <span id="countdown">10</span>s</span>
            </div>

            <a href="/" class="home-link">Click here to skip the wait</a>
        </div>
    </main>

    {% include 'footer.html' %}

    <script>
        let seconds = 10;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if(countdownElement) countdownElement.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "/";
            }
        }, 1000);
    </script>
</body>
</html>
