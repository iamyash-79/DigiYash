<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.08);
  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; }

/* Dynamic Background Glows */
.aura-bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden; z-index: -1;
}
.aura-blob {
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  filter: blur(80px);
  border-radius: 50%;
  opacity: 0.5;
  animation: float 20s infinite alternate;
}

@keyframes float {
  from { transform: translate(-10%, -10%); }
  to { transform: translate(100%, 20%); }
}

/* Floating Header */
header {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 95%;
  max-width: 1200px;
  z-index: 1000;
}

.navbar {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.logo {
  font-weight: 700;
  font-size: 1.5rem;
  color: #fff;
  letter-spacing: -1px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 15px var(--accent);
}

/* Desktop Links */
.nav-links { display: flex; gap: 1.5rem; }

.nav-links a {
  text-decoration: none;
  color: #9ca3af;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  transition: all 0.3s ease;
}

.nav-links a:hover {
  color: #fff;
  background: rgba(255,255,255,0.05);
}

/* Luxury Button */
.cta-btn {
  background: #fff;
  color: #000;
  padding: 0.6rem 1.4rem;
  border-radius: 14px;
  font-weight: 600;
  font-size: 0.85rem;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.cta-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(255,255,255,0.2);
}

/* Mobile Toggle */
.menu-toggle {
  display: none;
  cursor: pointer;
  width: 30px;
}

.menu-toggle span {
  display: block;
  height: 2px;
  background: #fff;
  margin: 6px 0;
  transition: 0.3s;
}

/* Mobile Menu Expansion */
.mobile-menu {
  position: absolute;
  top: 80px; left: 0; width: 100%;
  background: rgba(3, 7, 18, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2rem;
  display: none;
  flex-direction: column;
  gap: 1.5rem;
  text-align: center;
}

.mobile-menu.active { display: flex; }

@media (max-width: 768px) {
  .nav-links, .cta-wrapper { display: none; }
  .menu-toggle { display: block; }
}
</style>

<div class="aura-bg">
  <div class="aura-blob"></div>
</div>

<header>
  <nav class="navbar">
    <div class="logo">
      <div class="logo-dot"></div> SahuOne
    </div>

    <div class="nav-links">
      <a href="/">Showcase</a>
      <a href="/philosophy">Philosophy</a>
      <a href="/expertise">Expertise</a>
      <a href="/connect">Connect</a>
    </div>

    <div class="cta-wrapper">
      <a href="/connect" class="cta-btn">Get Started</a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">
      <span></span><span></span>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <a href="/" style="color:white; text-decoration:none;">Showcase</a>
      <a href="/philosophy" style="color:white; text-decoration:none;">Philosophy</a>
      <a href="/expertise" style="color:white; text-decoration:none;">Expertise</a>
      <a href="/connect" style="color:white; text-decoration:none;">Connect</a>
      <a href="/connect" style="color:black; text-decoration:none;" class="cta-btn">Get Started</a>
    </div>
  </nav>
</header>

<script>
function toggleMenu() {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('active');
}

// Subtle mouse follow effect for the glass glow
document.addEventListener('mousemove', (e) => {
  const blob = document.querySelector('.aura-blob');
  const x = e.clientX;
  const y = e.clientY;
  blob.style.transform = `translate(${x/10}px, ${y/10}px)`;
});
</script>
